# ==============================================================================
# 知识库 MCP Server 配置
# ==============================================================================
server:
  port: 8082

spring:
  application:
    name: kb-mcp-server

mcp:
  server:
    # 对外广播的服务名与版本（MCP initialize 握手时返回给客户端）
    name: kb-mcp-server
    version: 1.0.0
    # 协议版本：选择与主流客户端兼容的日期版本
    # [待核实: 各客户端支持的最高协议版本，可用 tools/list 实测]
    protocol-version: "2024-11-05"
  # SSE 端点路径（客户端先 GET 这个地址建立事件流）
  sse-path: /sse
  # 消息回传端点（客户端向这个地址 POST JSON-RPC 请求）
  message-path: /mcp/message

logging:
  level:
    com.demo.mcp: INFO
